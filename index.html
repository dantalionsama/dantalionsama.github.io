<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risa's Toolbox</title>
<style>
:root{--bg:#15131a;--panel:#1e1b26;--line:#352f44;--text:#e8e4f0;--mute:#9a93ad;--acc:#c78bd6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:60px 20px}
h1{margin:0 0 6px}
p.sub{color:var(--mute);margin:0 0 32px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;width:100%;max-width:760px}
a.card{display:block;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:inherit;text-decoration:none}
a.card:hover{border-color:var(--acc)}
a.card h2{margin:0 0 4px;font-size:17px;color:var(--acc)}
a.card span{color:var(--mute);font-size:13px}
.soon{opacity:.45;border-style:dashed}
</style>
</head>
<body>
<h1>Toolbox</h1>
<p class="sub">Little Lumiverse tools. Everything runs in your browser; nothing gets uploaded.</p>
<div class="grid">
  <a class="card" href="lorebook.html"><h2>Lorebook Editor</h2><span>Edit Lumiverse world book JSON files</span></a>
  <a class="card" href="cards.html"><h2>Character Card Editor</h2><span>Edit PNG and CHARX character cards</span></a>
  <div class="card soon"><h2>More soon…</h2><span>Add a link here for each new tool</span></div>
</div>
</body>
</html>
